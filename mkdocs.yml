site_name: Techcombank Architecture
site_description: Architecture-As-Code repository with Design Approval Board governance
site_author: Techcombank EA Team
site_url: https://techcombank.gitlab.io/architecture

repo_name: architecture
repo_url: https://gitlab.com/techcombank/architecture
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ./public

theme:
  name: material
  # Material's own bundled palette CSS hardcodes its dark-mode background/
  # foreground rules to the literal scheme name "slate" -- confirmed by
  # inspecting the generated stylesheet, no rule exists for any other custom
  # name. "light"/"dark" (the names this repo used previously) never
  # matched that rule, so toggling only ever recolored primary/accent
  # (which *are* generated per arbitrary name) while the page background
  # silently stayed light. "default"/"slate" are Material's real names.
  palette:
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Google Fonts disabled: the Techcombank design system specifies SF Pro
  # Display, which is not self-hostable here (Apple's font license doesn't
  # cover redistributing it on a non-Apple site) -- see stylesheets/extra.css
  # for the fallback-stack approach instead.
  font: false
  logo: assets/techcombank-mobile-mark.webp
  favicon: assets/favicon.ico
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tooltips

