markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      linenums: false
  - def_list
  - extra
  - footnotes
  - md_in_html
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.blocks.html
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.arithmatex:
      block_tag: 'div'
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      # `!!python/object:` (a bare pickled-state tag) stopped deserializing
      # under current PyYAML/pymdown-extensions -- confirmed empirically,
      # it raises `TypeError: invalid partial state` at config-load time,
      # before mkdocs even starts building, so no page ever got past this.
      # `!!python/object/apply:` (calling the constructor with kwds) is
      # pymdown-extensions' own documented form and works unchanged.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: en
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: "#f5f6f8"
          primaryTextColor: "#212121"
          primaryBorderColor: "#ed1c24"
          lineColor: "#616161"
          secondaryColor: "#ffffff"
          tertiaryColor: "#ffffff"
  - exclude:
      glob:
        - ".*"
        - "*.pyc"
        - ".venv/**/*"
        - ".git/**/*"
        - "*.egg-info/**/*"
        - "__pycache__/**/*"
        - "node_modules/**/*"
        - ".gitlab/**/*"
        - "templates/**/*"
        # qe-harness's own build output: Maven/npm/pip artefacts, none
        # of it hand-authored docs. Without these, mkdocs walks
        # qe-harness/harness/jmeter/target/**/report-template/ (JMeter's
        # bundled bower_components) and qe-harness/harness/k6/node_modules/
        # -- thousands of vendored READMEs that dwarf the harness's own 9
        # real markdown files and make a full build impractically slow.
        - "qe-harness/**/target/**/*"
        - "qe-harness/**/node_modules/**/*"
        - "qe-harness/**/.venv/**/*"
        - "qe-harness/**/.pytest_cache/**/*"
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

