# Machine-readable projection of NFR numeric targets.
#
# The gate (scripts/validate-harness-coverage.py, check 6) proves each threshold_ref
# resolves to a real NFR-* catalog row and a heading anchor that exists in that row's
# document. It does NOT prove the value below matches that document's prose — see
# qe-harness/README.md ("What the Threshold Gate Does Not Prove"). A human owns value
# accuracy. Update this file whenever the cited NFR row changes.
#
# Profile files (baseline.yml, load.yml, ...) never hardcode a number for one of these
# concepts — they reference the threshold by `name` in their `threshold_names` list.
# Profile *shape* parameters (durations, ramp times, step counts, drift tolerances) are
# not projected here: TST-002 (performance-test-standard.md) states plainly that those
# numbers are profile parameters owned by that document, not service SLOs owned by the
# NFR spine, so they stay literal in the profile files.
version: 1
thresholds:
  # --- Latency (NFR-002 Latency Budget Model) ---
  # Source table: "End-to-end budgets per tier (customer-facing)", T0 sync API row
  # (payment auth / card auth / ledger post) — the strictest customer-facing tier.
  - name: p50_latency_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 50
    unit: ms
    applies_to: [load]

  - name: p95_latency_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 200
    unit: ms
    applies_to: [baseline, load, mixed]

  - name: p99_latency_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 500
    unit: ms
    applies_to: [load]

  # --- Throughput (NFR-004 Throughput Model) ---
  # Source table: "NAPAS Payment Processing — Throughput Targets".
  - name: sustained_rps
    threshold_ref: NFR-004#napas-payment-processing--throughput-targets
    value: 500
    unit: tps
    applies_to: [soak, scalability]

  - name: peak_rps
    threshold_ref: NFR-004#napas-payment-processing--throughput-targets
    value: 1500
    unit: tps
    applies_to: [stress, spike]

  # NOTE — divergence from TST-002's stated `load` pass criterion (≤ 0.1%):
  # TST-002 (performance-test-standard.md) states the load profile's error-rate pass
  # criterion as "≤ 0.1%" twice, but that figure appears nowhere in the NFR corpus —
  # it has no citation. Inventing an NFR-* citation to justify TST-002's uncited 0.1%
  # would itself violate the no-fabricated-citations rule this file exists to satisfy.
  # This projection instead uses NFR-004's actual documented figure (< 0.01%, a 10x
  # tighter bound), since it is the only real, citable error-rate target in the corpus.
  # The TST-002/NFR-004 inconsistency is a pre-existing Wave 15 corpus gap, tracked
  # separately as a wave-level follow-up — not resolved by changing either document here.
  - name: error_rate_pct
    threshold_ref: NFR-004#napas-payment-processing--throughput-targets
    value: 0.01
    unit: pct
    applies_to: [load]

  # --- Recovery (NFR-001 Service Tiering + RTO/RPO Matrix) ---
  # Source table: "Authoritative RTO/RPO matrix", T0 row.
  - name: rto_minutes
    threshold_ref: NFR-001#authoritative-rtorpo-matrix
    value: 5
    unit: min
    applies_to: [failover-under-load]

  - name: rpo_minutes
    threshold_ref: NFR-001#authoritative-rtorpo-matrix
    value: 0
    unit: min
    applies_to: [failover-under-load]

  # --- Error budget (NFR-005 Error Budget Policy) ---
  # Source table: "1. SLO Definitions by Tier", T0 row, 30-day error budget column.
  - name: error_budget_30d_minutes
    threshold_ref: NFR-005#1-slo-definitions-by-tier
    value: 4.32
    unit: min
    applies_to: [failover-under-load]

  # --- Client payload budget (NFR-003 Capacity Planning Model) ---
  # Source table: "Input Parameters", `avg_payload_bytes` row (2,048 bytes). Read the
  # surrounding prose carefully before treating this as a ceiling (Task 22 did): NFR-003
  # documents 2,048 as a MEAN request+response payload -- an input to Little's Law/Kafka
  # sizing for one worked example (the NAPAS gateway at Tết peak), not a stated maximum for
  # any client response. No NFR document in this corpus states a client-payload-size
  # ceiling directly (checked: NFR-002 Latency, NFR-004 Throughput -- neither mentions
  # payload size at all beyond NFR-004's own throughput-per-partition sizing, which is a
  # Kafka input, not a client-facing bound either). Inventing a bespoke number here would
  # violate the no-fabricated-thresholds rule this file exists to enforce.
  # This entry instead derives a ceiling from NFR-003's own value, using NFR-003's own
  # margin convention: the same document's "Worked Example" table applies a 1.5x
  # "Headroom" multiplier to convert a normal/peak figure into a provisioned ceiling
  # ("this absorbs unexpected spikes ... without breaching SLOs"). Applying that same 1.5x
  # to avg_payload_bytes: 2,048 x 1.5 = 3,072 bytes. This is Task 22's own derived
  # interpretation, not a number NFR-003 states as a payload budget outright -- per this
  # file's own header comment, a human still owns confirming this derivation is the right
  # one for TST-043's actual scope (GET /catalogue's response size).
  # Not referenced by any profiles/*.yml `threshold_names` list: TST-043 (k6,
  # qe-harness/harness/k6/tst-043-clientexp) is outside the JMeter/Gatling profile-shape
  # system those files describe entirely; `bin/run-k6.sh` resolves this entry directly.
  - name: payload_budget_bytes
    threshold_ref: NFR-003#input-parameters
    value: 3072
    unit: bytes
    applies_to: [client-experience]

  # --- Per-journey latency for TST-034's blend (NFR-002 Latency Budget Model) ---
  # Source table: "End-to-end budgets per tier (customer-facing)". One entry per
  # tier the wave17-core-mix blend touches, because TST-034's I1 asserts every
  # journey against its OWN tier budget and never against a single blended
  # figure. Same anchor as p50/p95/p99_latency_ms above -- no new NFR section is
  # needed, and none is created.
  - name: p95_latency_t0_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 200
    unit: ms
    applies_to: [mixed]

  - name: p95_latency_t1_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 500
    unit: ms
    applies_to: [mixed]

  - name: p95_latency_t2_ms
    threshold_ref: NFR-002#end-to-end-budgets-per-tier-customer-facing
    value: 2000
    unit: ms
    applies_to: [mixed]
