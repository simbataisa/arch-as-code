# TST-031 token-bucket rate limiter (Task 8). Capacity equals this rate,
# refilling over a one-second window -- see RateLimitFilter/TokenBucket.
app.ratelimit.permits-per-second=10

# TST-040 AuthN/AuthZ (Task 9). clock-skew-seconds is the *declared* tolerance
# JwtService's JJWT parser is actually configured with (JwtParserBuilder#clockSkewSeconds);
# TokenLifecycleTest#expiredTokenIsNotAcceptedBeyondDeclaredSkew measures the real
# accepted exp offset and asserts it against this same property -- never the other way
# around -- per this corpus's no-hardcoded-thresholds rule. See qe-harness/README.md.
app.authz.clock-skew-seconds=5
app.authz.access-token-ttl-seconds=300
app.authz.refresh-token-ttl-seconds=3600

# TST-030 versioned API (Task 10). Publish springdoc's generated OpenAPI
# document at /openapi.json instead of its default /v3/api-docs -- see
# OpenApiConfig. No browsable UI is needed, so it stays disabled.
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.enabled=false
