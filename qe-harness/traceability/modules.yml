# Which harness module implements which archetype. The traceability gate reads this.
# tool MUST equal the archetype's declared best fit in TST-010.
version: 1
modules:
  - archetype: TST-021
    tool: jmeter
    path: qe-harness/harness/jmeter/tst-021-ledger
    coverage: full
    defect_flag: ledger-unbalanced
  - archetype: TST-030
    tool: gatling-karate
    path: qe-harness/harness/gatling-karate/tst-030-contract
    coverage: full
    defect_flag: schema-drift
  - archetype: TST-031
    tool: jmeter
    path: qe-harness/harness/jmeter/tst-031-ratelimit
    coverage: full
    defect_flag: ratelimit-leaky
  - archetype: TST-035
    tool: jmeter
    path: qe-harness/harness/jmeter/tst-035-faultinjection
    coverage: full
    defect_flag: breaker-disabled
  - archetype: TST-039
    tool: locust
    path: qe-harness/harness/locust/tst_039_recon
    coverage: full
    defect_flag: recon-false-clean
  - archetype: TST-040
    tool: jmeter
    path: qe-harness/harness/jmeter/tst-040-authz
    coverage: full
    defect_flag: authz-missing-marker
  - archetype: TST-043
    tool: k6
    path: qe-harness/harness/k6/tst-043-clientexp
    coverage: partial
    partial_reason: >-
      None of the archetype's own I1-I6 are implemented: I1/I2/I6 need an offline client, I3/I4
      a rendered DOM, and I5 k6/browser against a real page - no such application exists in this
      repository. This module ships four substitute server-side HTTP invariants (perf budget,
      cache correctness, conditional requests, compression) which are renumbered I1-I4 and are
      NOT the archetype's I1-I4.
    defect_flag: cache-headers-absent
