# Testing coverage — source of truth.
#
# One row per Approved row in governance/standards/_catalog-inventory.yml.
# Validated by scripts/validate-testing-coverage.py.
# Rendered into coverage-matrix.md by scripts/render-testing-coverage.py.
#
# Field domains:
#   disciplines.*   required | recommended | n/a | governs
#   perf_profiles[] baseline | load | stress | spike | soak | mixed |
#                   scalability | failover-under-load
#   primary_tool    jmeter | gatling-karate | k6 | locust
#   archetypes[]    TST-020 .. TST-043; may be empty only when every
#                   discipline is 'governs'
#
# 'governs' rows — NFR spine docs, principles, templates, compliance
# deep-dives, process best-practices, platform meta-docs and the testing
# corpus itself — constrain how other rows are tested rather than being
# under test themselves. They carry no archetypes and no perf_profiles.
# primary_tool is a required field with no meaningful value on such a row,
# so every 'governs' row sets it to 'jmeter' uniformly. That is a schema
# placeholder, NOT a real tool assignment — do not read it as one. The
# 'notes' field names the archetype that verifies the doc in practice,
# where one applies.
